name: veille-drops
on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les ~5 min (GitHub peut retarder un peu)
  workflow_dispatch:
    inputs:
      hello:
        description: "Envoyer une notification de test"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Vérifier les produits
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.hello }}" = "true" ]; then EXTRA="--hello"; fi
          python watcher_cloud.py $EXTRA

      - name: Sauvegarder l'état
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "veille-bot"
            git config user.email "veille-bot@users.noreply.github.com"
            git add state.json
            git commit -m "état $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || true
            git push
          fi
